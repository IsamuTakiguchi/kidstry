name: Deploy to GitHub Pages

# GitHub Pages が ゆうこうな ときだけ こうかいする。
# まだ ゆうこうで ない ばあいは、しっぱい させずに おしらせを のこして スキップする。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Settings → Pages → Source を \"GitHub Actions\" にすると、次回の push から自動で公開されます。"
          fi

      - name: Build site
        if: steps.check.outputs.enabled == 'true'
        run: npm run build

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
